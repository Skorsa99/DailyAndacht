<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Andacht &ndash; Bild erstellen</title>
<style>
  /* Admin chrome uses the same minimal Courier styling as the manual/assisted
     pages. The promo preview is a live iframe of /image/card, which carries the
     reader's own fonts and styles, so this page needs no webfonts of its own. */
  :root {
    --primary-color: #1A1D1E;
    --secondary-color: #EFEFEF;
    --font: Courier;
    --paper:      #EFEFEF;
    --ink-mute:   #6A7640;   /* olive — used for muted hints */
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font), monospace;
    background: var(--secondary-color);
    color: var(--primary-color);
    max-width: 1080px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  nav { margin-bottom: 1.5rem; }
  nav a { color: var(--primary-color); margin-right: 1rem; }
  nav a.active { font-weight: bold; text-decoration: underline; }
  h1 { font-size: 1.3rem; }

  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) auto;
    gap: 2rem;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ----- Sermon list ----- */
  .list-panel { min-width: 0; }
  #search {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.5rem;
    border: 1px solid var(--primary-color);
    background: white;
    color: var(--primary-color);
    margin-bottom: 0.75rem;
  }
  #count {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #666;
    margin-bottom: 0.5rem;
  }
  #sermon-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid var(--primary-color);
    background: white;
  }
  .sermon-item {
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid rgba(26,29,30,0.12);
    cursor: pointer;
  }
  .sermon-item:last-child { border-bottom: none; }
  .sermon-item:hover { background: #f4f0ee; }
  .sermon-item.selected { background: var(--primary-color); color: var(--secondary-color); }
  .sermon-item__date {
    flex: 0 0 6.2rem;
    font-size: 0.72rem;
    white-space: nowrap;
  }
  .sermon-item__title {
    font-size: 0.85rem;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* ----- Preview side ----- */
  .preview-panel {
    position: sticky;
    top: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .preview-hint {
    font-size: 0.8rem;
    color: #666;
    text-align: center;
    max-width: 360px;
  }
  .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 0.55rem 1rem;
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--primary-color);
    color: var(--secondary-color);
    border: none;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--primary-color);
    border: 1px solid var(--primary-color);
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ----- Promo preview (a live iframe of the real card, so what you see is
     exactly what the PNG export renders) ----- */
  .promo-wrap {
    width: 360px;
    height: 640px;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(26,29,30,.08), 0 18px 40px rgba(26,29,30,.16);
  }
  #promo-frame {
    width: 360px;
    height: 640px;
    border: none;
    display: block;
  }
  #promo-frame[hidden] { display: none; }
  .promo-empty {
    width: 360px;
    height: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 34px;
    color: var(--ink-mute);
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.6;
    letter-spacing: 0.08em;
  }
  .promo-empty[hidden] { display: none; }
</style>
</head>
<body>
  <nav>
    <a href="/manual">Manuell</a>
    <a href="/assisted">KI-Unterst&uuml;tzt</a>
    <a href="/image" class="active">Bild erstellen</a>
  </nav>
  <h1>Promo-Bild erstellen</h1>

  <div class="layout">
    <div class="list-panel">
      <input type="search" id="search" placeholder="Andacht suchen (Titel oder Datum)&hellip;" autocomplete="off">
      <div id="count"></div>
      <ul id="sermon-list"></ul>
    </div>

    <div class="preview-panel">
      <div class="promo-wrap">
        <div id="promo-empty" class="promo-empty">W&auml;hle links eine Andacht aus,<br>um ein Bild zu erzeugen.</div>
        <iframe id="promo-frame" title="Vorschau" hidden></iframe>
      </div>
      <div class="actions">
        <button id="download-btn" disabled>Als Bild speichern (PNG)</button>
        <button id="newtab-btn" class="secondary" disabled>In neuem Tab &ouml;ffnen</button>
      </div>
      <div class="preview-hint">Format 9:16 &middot; Export in 1080&times;1920&nbsp;px.</div>
    </div>
  </div>

  <script>
    function parseISO(s) {
      const p = String(s).split("-");
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }
    function shortDate(iso) {
      const d = parseISO(iso);
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return dd + "." + mm + "." + d.getFullYear();
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function slugify(s) {
      return String(s || "andacht")
        .toLowerCase()
        .replace(/[äàá]/g, "a").replace(/[öòó]/g, "o").replace(/[üùú]/g, "u").replace(/ß/g, "ss")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "andacht";
    }

    const searchEl = document.getElementById("search");
    const countEl = document.getElementById("count");
    const listEl = document.getElementById("sermon-list");
    const frameEl = document.getElementById("promo-frame");
    const emptyEl = document.getElementById("promo-empty");
    const downloadBtn = document.getElementById("download-btn");
    const newtabBtn = document.getElementById("newtab-btn");

    let allSermons = [];
    let selectedId = null;
    let selected = null;   // { id, date, title } of the previewed sermon

    async function loadSermons() {
      const res = await fetch("/api/sermons");
      const json = await res.json();
      if (!json.ok) return;
      allSermons = json.sermons;
      renderList(allSermons);
      const preselect = new URLSearchParams(location.search).get("id");
      const match = allSermons.find(function (s) { return s.id === preselect; });
      if (match) selectSermon(match);
    }

    function renderList(sermons) {
      listEl.innerHTML = "";
      countEl.textContent = sermons.length + " Andacht" + (sermons.length === 1 ? "" : "en");
      for (const s of sermons) {
        const li = document.createElement("li");
        li.className = "sermon-item" + (s.id === selectedId ? " selected" : "");
        li.dataset.id = s.id;
        li.innerHTML =
          '<span class="sermon-item__date">' + shortDate(s.date) + '</span>' +
          '<span class="sermon-item__title">' + esc(s.title) + '</span>';
        li.addEventListener("click", function () { selectSermon(s); });
        listEl.appendChild(li);
      }
    }

    function applyFilter() {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) return renderList(allSermons);
      const filtered = allSermons.filter(function (s) {
        return s.title.toLowerCase().includes(q) ||
               s.date.includes(q) ||
               shortDate(s.date).includes(q);
      });
      renderList(filtered);
    }

    function selectSermon(s) {
      selected = s;
      selectedId = s.id;
      for (const li of listEl.children) {
        li.classList.toggle("selected", li.dataset.id === s.id);
      }
      emptyEl.hidden = true;
      frameEl.hidden = false;
      frameEl.src = "/image/card/" + s.id;
      downloadBtn.disabled = false;
      newtabBtn.disabled = false;
    }

    // Render the true PNG server-side (headless Chrome), so it matches the
    // preview exactly. Rendering takes a moment, hence the loading state.
    async function fetchPng() {
      const res = await fetch("/image/render/" + selected.id + ".png");
      if (!res.ok) {
        let msg = "Bild konnte nicht erzeugt werden.";
        try { msg = (await res.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      return res.blob();
    }

    async function withLoading(btn, fn) {
      if (!selected) return;
      const label = btn.textContent;
      downloadBtn.disabled = true;
      newtabBtn.disabled = true;
      btn.textContent = "Erzeuge Bild…";
      try {
        await fn();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.textContent = label;
        downloadBtn.disabled = false;
        newtabBtn.disabled = false;
      }
    }

    downloadBtn.addEventListener("click", function () {
      withLoading(downloadBtn, async function () {
        const blob = await fetchPng();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = "dailyandacht-" + selected.date + "-" + slugify(selected.title) + ".png";
        link.href = url;
        link.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });
    });

    newtabBtn.addEventListener("click", function () {
      // Open the tab synchronously (before the await) so popup blockers allow it.
      const tab = window.open("", "_blank");
      withLoading(newtabBtn, async function () {
        try {
          const blob = await fetchPng();
          const url = URL.createObjectURL(blob);
          if (tab) tab.location = url; else window.open(url, "_blank");
        } catch (err) {
          if (tab) tab.close();
          throw err;
        }
      });
    });

    searchEl.addEventListener("input", applyFilter);
    loadSermons();
  </script>
</body>
</html>
