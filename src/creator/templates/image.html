<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Andacht &ndash; Bild erstellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --primary-color: #1A1D1E;
    --secondary-color: #EFEFEF;
    --font: Courier;

    /* Reader identity tokens (mirrored from src/css/main.css) */
    --paper:      #EFEFEF;
    --ink:        #9E5867;   /* title — muted rose */
    --ink-soft:   #84616A;
    --ink-mute:   #6A7640;   /* meta, labels — muted olive */
    --accent:     #6A7640;
    --ink-orig:   #1A1D1E;   /* body / wordmark */
    --ink-soft-orig: #43464A;
    --rule:       rgba(26, 29, 30, 0.16);
    --serif-display: "Fraunces", Georgia, "Times New Roman", serif;
    --serif-body:    "Spectral", Georgia, serif;
    --mono:          "Courier Prime", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font), monospace;
    background: var(--secondary-color);
    color: var(--primary-color);
    max-width: 1080px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  nav { margin-bottom: 1.5rem; }
  nav a { color: var(--primary-color); margin-right: 1rem; }
  nav a.active { font-weight: bold; text-decoration: underline; }
  h1 { font-size: 1.3rem; }

  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) auto;
    gap: 2rem;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ----- Sermon list ----- */
  .list-panel { min-width: 0; }
  #search {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.5rem;
    border: 1px solid var(--primary-color);
    background: white;
    color: var(--primary-color);
    margin-bottom: 0.75rem;
  }
  #count {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #666;
    margin-bottom: 0.5rem;
  }
  #sermon-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid var(--primary-color);
    background: white;
  }
  .sermon-item {
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid rgba(26,29,30,0.12);
    cursor: pointer;
  }
  .sermon-item:last-child { border-bottom: none; }
  .sermon-item:hover { background: #f4f0ee; }
  .sermon-item.selected { background: var(--primary-color); color: var(--secondary-color); }
  .sermon-item__date {
    flex: 0 0 6.2rem;
    font-size: 0.72rem;
    white-space: nowrap;
  }
  .sermon-item__title {
    font-size: 0.85rem;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* ----- Preview side ----- */
  .preview-panel {
    position: sticky;
    top: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .preview-hint {
    font-size: 0.8rem;
    color: #666;
    text-align: center;
    max-width: 360px;
  }
  .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 0.55rem 1rem;
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--primary-color);
    color: var(--secondary-color);
    border: none;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--primary-color);
    border: 1px solid var(--primary-color);
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============================================================
     PROMO CARD — 9:16, editorial reader design
     Displayed at 360x640; exported at scale 3 -> 1080x1920.
     ============================================================ */
  .promo-wrap {
    width: 360px;
    height: 640px;
    box-shadow: 0 1px 2px rgba(26,29,30,.08), 0 18px 40px rgba(26,29,30,.16);
  }
  #promo {
    position: relative;
    width: 360px;
    height: 640px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink-orig);
    display: flex;
    flex-direction: column;
    padding: 54px 34px 0;
  }
  #promo.empty {
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-mute);
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    padding: 34px;
  }

  .promo__head {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
  }
  .promo__mark {
    width: 46px;
    height: 46px;
  }
  .promo__word {
    margin-top: 0.6rem;
    font-family: var(--serif-display);
    font-weight: 600;
    font-size: 0.62rem;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    color: var(--ink-orig);
  }

  .promo__meta {
    margin: 26px 0 14px;
    text-align: center;
    font-family: var(--mono);
    font-size: 0.56rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    line-height: 1.5;
  }
  .promo__meta .dot { color: var(--accent); margin: 0 0.5em; }

  .promo__title {
    margin: 0 auto 16px;
    max-width: 15ch;
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: 1.55rem;
    line-height: 1.1;
    letter-spacing: -0.012em;
    text-align: center;
    color: var(--ink);
  }

  .promo__scripture {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 18px;
    flex: 0 0 auto;
  }
  .promo__scripture-label {
    font-family: var(--mono);
    font-size: 0.5rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .promo__scripture-ref {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 0.92rem;
    line-height: 1.3;
    text-align: center;
    color: var(--accent);
  }
  .promo__scripture::after {
    content: "";
    width: 1.8rem;
    height: 1px;
    margin-top: 0.25rem;
    background: var(--rule);
  }

  .promo__body {
    flex: 1 1 auto;
    overflow: hidden;
    font-family: var(--serif-body);
    font-size: 0.82rem;
    line-height: 1.6;
    color: var(--ink-orig);
    text-align: left;
  }
  .promo__body p { margin: 0 0 0.85em; }
  .promo__body p:first-of-type::first-letter {
    font-family: var(--serif-display);
    font-weight: 600;
    font-size: 2.6em;
    line-height: 0.82;
    float: left;
    margin: 0.04em 0.1em 0 0;
    color: var(--accent);
  }

  /* Fade the teaser into the paper toward the bottom */
  .promo__fade {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 240px;
    background: linear-gradient(to bottom,
      rgba(239,239,239,0) 0%,
      rgba(239,239,239,0.85) 55%,
      var(--paper) 82%);
    pointer-events: none;
    z-index: 2;
  }
  .promo__foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    text-align: center;
    z-index: 3;
    font-family: var(--mono);
    font-size: 0.54rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .promo__foot .cta {
    display: block;
    margin-bottom: 0.35rem;
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--ink);
  }
</style>
</head>
<body>
  <nav>
    <a href="/manual">Manuell</a>
    <a href="/assisted">KI-Unterst&uuml;tzt</a>
    <a href="/image" class="active">Bild erstellen</a>
  </nav>
  <h1>Promo-Bild erstellen</h1>

  <div class="layout">
    <div class="list-panel">
      <input type="search" id="search" placeholder="Andacht suchen (Titel oder Datum)&hellip;" autocomplete="off">
      <div id="count"></div>
      <ul id="sermon-list"></ul>
    </div>

    <div class="preview-panel">
      <div class="promo-wrap">
        <div id="promo" class="empty">W&auml;hle links eine Andacht aus,<br>um ein Bild zu erzeugen.</div>
      </div>
      <div class="actions">
        <button id="download-btn" disabled>Als Bild speichern (PNG)</button>
        <button id="newtab-btn" class="secondary" disabled>In neuem Tab &ouml;ffnen</button>
      </div>
      <div class="preview-hint">Format 9:16 &middot; Export in 1080&times;1920&nbsp;px.</div>
    </div>
  </div>

  <script>
    const MONTHS_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
    const WEEKDAYS_DE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

    function parseISO(s) {
      const p = String(s).split("-");
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }
    function formatDateLong(iso) {
      const d = parseISO(iso);
      return d.getDate() + ". " + MONTHS_DE[d.getMonth()] + " " + d.getFullYear();
    }
    function weekday(iso) { return WEEKDAYS_DE[parseISO(iso).getDay()]; }
    function shortDate(iso) {
      const d = parseISO(iso);
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return dd + "." + mm + "." + d.getFullYear();
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function paragraphs(text) {
      return String(text || "")
        .split(/\n{1,}/)
        .map(function (p) { return p.trim(); })
        .filter(Boolean)
        .map(function (p) { return "<p>" + esc(p) + "</p>"; })
        .join("");
    }
    function slugify(s) {
      return String(s || "andacht")
        .toLowerCase()
        .replace(/[äàá]/g, "a").replace(/[öòó]/g, "o").replace(/[üùú]/g, "u").replace(/ß/g, "ss")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "andacht";
    }

    const searchEl = document.getElementById("search");
    const countEl = document.getElementById("count");
    const listEl = document.getElementById("sermon-list");
    const promoEl = document.getElementById("promo");
    const downloadBtn = document.getElementById("download-btn");
    const newtabBtn = document.getElementById("newtab-btn");

    let allSermons = [];
    let selectedId = null;
    let currentSermon = null;   // full JSON of the rendered promo

    async function loadSermons() {
      const res = await fetch("/api/sermons");
      const json = await res.json();
      if (!json.ok) return;
      allSermons = json.sermons;
      renderList(allSermons);
      const preselect = new URLSearchParams(location.search).get("id");
      if (preselect && allSermons.some(function (s) { return s.id === preselect; })) {
        selectSermon(preselect);
      }
    }

    function renderList(sermons) {
      listEl.innerHTML = "";
      countEl.textContent = sermons.length + " Andacht" + (sermons.length === 1 ? "" : "en");
      for (const s of sermons) {
        const li = document.createElement("li");
        li.className = "sermon-item" + (s.id === selectedId ? " selected" : "");
        li.dataset.id = s.id;
        li.innerHTML =
          '<span class="sermon-item__date">' + shortDate(s.date) + '</span>' +
          '<span class="sermon-item__title">' + esc(s.title) + '</span>';
        li.addEventListener("click", function () { selectSermon(s.id); });
        listEl.appendChild(li);
      }
    }

    function applyFilter() {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) return renderList(allSermons);
      const filtered = allSermons.filter(function (s) {
        return s.title.toLowerCase().includes(q) ||
               s.date.includes(q) ||
               shortDate(s.date).includes(q);
      });
      renderList(filtered);
    }

    async function selectSermon(id) {
      selectedId = id;
      for (const li of listEl.children) {
        li.classList.toggle("selected", li.dataset.id === id);
      }
      promoEl.className = "empty";
      promoEl.innerHTML = "Lade Andacht&hellip;";
      downloadBtn.disabled = true;
      newtabBtn.disabled = true;
      try {
        const res = await fetch("/api/sermon/" + id);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Nicht gefunden");
        currentSermon = json.sermon;
        renderPromo(currentSermon);
        downloadBtn.disabled = false;
        newtabBtn.disabled = false;
      } catch (err) {
        promoEl.className = "empty";
        promoEl.textContent = "Fehler: " + err.message;
      }
    }

    function renderPromo(a) {
      const readTime = a.read_time_minutes ? esc(a.read_time_minutes) + " Min. Lesezeit" : "";
      const meta = [weekday(a.date), formatDateLong(a.date), readTime]
        .filter(Boolean)
        .join('<span class="dot">&#9670;</span>');

      let html =
        '<div class="promo__head">' +
          '<img class="promo__mark" src="/assets/logo.jpeg" alt="DailyAndacht" crossorigin="anonymous">' +
          '<span class="promo__word">DailyAndacht</span>' +
        '</div>' +
        '<p class="promo__meta">' + meta + '</p>' +
        '<h1 class="promo__title">' + esc(a.title) + '</h1>';

      if ((a.bible_verse || "").trim()) {
        html +=
          '<div class="promo__scripture">' +
            '<span class="promo__scripture-label">Bibeltext</span>' +
            '<span class="promo__scripture-ref">' + esc(a.bible_verse.trim()) + '</span>' +
          '</div>';
      }

      html += '<div class="promo__body">' + paragraphs(a.body) + '</div>';
      html += '<div class="promo__fade"></div>';
      html +=
        '<div class="promo__foot">' +
          '<span class="cta">Neue Andacht ist da</span>' +
          'www.dailyandacht.de' +
        '</div>';

      promoEl.className = "";
      promoEl.innerHTML = html;
    }

    async function renderCanvas() {
      await (document.fonts ? document.fonts.ready : Promise.resolve());
      return html2canvas(promoEl, {
        scale: 3,
        backgroundColor: "#EFEFEF",
        useCORS: true,
        width: 360,
        height: 640,
      });
    }

    downloadBtn.addEventListener("click", async function () {
      if (!currentSermon) return;
      downloadBtn.disabled = true;
      const label = downloadBtn.textContent;
      downloadBtn.textContent = "Erzeuge Bild…";
      try {
        const canvas = await renderCanvas();
        const link = document.createElement("a");
        link.download = "dailyandacht-" + currentSermon.date + "-" + slugify(currentSermon.title) + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        alert("Bild konnte nicht erzeugt werden: " + err.message);
      } finally {
        downloadBtn.textContent = label;
        downloadBtn.disabled = false;
      }
    });

    newtabBtn.addEventListener("click", async function () {
      if (!currentSermon) return;
      newtabBtn.disabled = true;
      const label = newtabBtn.textContent;
      newtabBtn.textContent = "Erzeuge Bild…";
      try {
        const canvas = await renderCanvas();
        canvas.toBlob(function (blob) {
          const url = URL.createObjectURL(blob);
          window.open(url, "_blank");
        }, "image/png");
      } catch (err) {
        alert("Bild konnte nicht erzeugt werden: " + err.message);
      } finally {
        newtabBtn.textContent = label;
        newtabBtn.disabled = false;
      }
    });

    searchEl.addEventListener("input", applyFilter);
    loadSermons();
  </script>
</body>
</html>
