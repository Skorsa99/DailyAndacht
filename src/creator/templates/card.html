<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>{{ title }} &ndash; DailyAndacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:      #EFEFEF;
    --ink:        #9E5867;
    --ink-mute:   #6A7640;
    --accent:     #6A7640;
    --ink-orig:   #1A1D1E;
    --rule:       rgba(26, 29, 30, 0.16);
    --serif-display: "Fraunces", Georgia, "Times New Roman", serif;
    --serif-body:    "Spectral", Georgia, serif;
    --mono:          "Courier Prime", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    width: 360px;
    height: 640px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink-orig);
    font-family: var(--serif-body);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "liga" 1, "onum" 1, "kern" 1;
  }

  #promo {
    position: relative;
    width: 360px;
    height: 640px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 54px 34px 0;
  }

  .promo__head {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
  }
  .promo__mark { width: 46px; height: 46px; }
  .promo__word {
    margin-top: 0.6rem;
    font-family: var(--serif-display);
    font-weight: 600;
    font-size: 0.62rem;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    color: var(--ink-orig);
  }

  .promo__meta {
    margin: 26px 0 14px;
    text-align: center;
    font-family: var(--mono);
    font-size: 0.56rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    line-height: 1.5;
  }
  .promo__meta .dot { color: var(--accent); margin: 0 0.5em; }

  .promo__title {
    margin: 0 auto 16px;
    max-width: 15ch;
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: 1.55rem;
    line-height: 1.1;
    letter-spacing: -0.012em;
    text-align: center;
    text-wrap: balance;
    color: var(--ink);
  }

  .promo__scripture {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 18px;
    flex: 0 0 auto;
  }
  .promo__scripture-label {
    font-family: var(--mono);
    font-size: 0.5rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .promo__scripture-ref {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 0.92rem;
    line-height: 1.3;
    text-align: center;
    color: var(--accent);
  }
  .promo__scripture::after {
    content: "";
    width: 1.8rem;
    height: 1px;
    margin-top: 0.25rem;
    background: var(--rule);
  }

  .promo__body {
    flex: 1 1 auto;
    overflow: hidden;
    font-family: var(--serif-body);
    font-size: 0.82rem;
    line-height: 1.6;
    color: var(--ink-orig);
    text-align: left;
  }
  .promo__body p { margin: 0 0 0.85em; }
  .promo__body p:first-of-type::first-letter {
    font-family: var(--serif-display);
    font-weight: 600;
    font-size: 2.6em;
    line-height: 0.82;
    float: left;
    margin: 0.04em 0.1em 0 0;
    color: var(--accent);
  }

  .promo__fade {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 240px;
    background: linear-gradient(to bottom,
      rgba(239,239,239,0) 0%,
      rgba(239,239,239,0.85) 55%,
      var(--paper) 82%);
    pointer-events: none;
    z-index: 2;
  }
  .promo__foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    text-align: center;
    z-index: 3;
    font-family: var(--mono);
    font-size: 0.54rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .promo__foot .cta {
    display: block;
    margin-bottom: 0.35rem;
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div id="promo">
    <div class="promo__head">
      <img class="promo__mark" src="/assets/logo.jpeg" alt="DailyAndacht">
      <span class="promo__word">DailyAndacht</span>
    </div>
    <p class="promo__meta">{{ weekday }}<span class="dot">&#9670;</span>{{ date_long }}{% if read_time %}<span class="dot">&#9670;</span>{{ read_time }} Min. Lesezeit{% endif %}</p>
    <h1 class="promo__title">{{ title }}</h1>
    {% if bible_verse %}
    <div class="promo__scripture">
      <span class="promo__scripture-label">Bibeltext</span>
      <span class="promo__scripture-ref">{{ bible_verse }}</span>
    </div>
    {% endif %}
    <div class="promo__body">
      {% for p in paragraphs %}<p>{{ p }}</p>{% endfor %}
    </div>
    <div class="promo__fade"></div>
    <div class="promo__foot">
      <span class="cta">Neue Andacht ist da</span>
      www.dailyandacht.de
    </div>
  </div>
</body>
</html>
